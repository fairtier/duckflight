name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet -tags=duckdb_arrow ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned rather than floating on latest: the config enables the
          # gofumpt formatter, and a linter bump can add formatting rules that
          # turn an unrelated PR red. It is also a hard floor — golangci-lint
          # refuses to run when the Go it was built with is below the module's
          # `go` directive, so a 1.27 go.mod needs a 1.27-built linter.
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -tags=duckdb_arrow -race -count=1 ./internal/...

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run Iceberg integration tests
        run: go test -tags="duckdb_arrow" -race -count=1 -timeout=10m ./test/...

  sqlalchemy-integration:
    name: SQLAlchemy + ADBC integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run SQLAlchemy / gizmosql dialect integration test
        # Boots DuckFlight in-process and runs a pytest container against it.
        # Exercises both raw adbc_driver_flightsql and the gizmosql SQLAlchemy
        # dialect — catches the kind of client-side bugs (rollback handling,
        # SqlInfo corruption) that Go-only tests miss.
        run: go test -tags="duckdb_arrow sqlalchemy_integration" -race -count=1 -timeout=20m ./test/...
