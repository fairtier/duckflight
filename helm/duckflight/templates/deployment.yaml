apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duckflight.fullname" . }}
  labels:
    {{- include "duckflight.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "duckflight.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "duckflight.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.extensions.image }}
      initContainers:
        # Copies the curated extension set into an emptyDir that shadows the
        # server image's baked /extensions — see .Values.extensions.
        - name: extensions
          image: {{ .Values.extensions.image | quote }}
          imagePullPolicy: {{ .Values.extensions.pullPolicy }}
          command: ["cp", "-a", "/extensions/.", "/target/"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: duckdb-extensions
              mountPath: /target
      {{- end }}
      containers:
        - name: duckflight
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: grpc
              containerPort: 31337
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:31337"
            - name: METRIC_ADDR
              value: "0.0.0.0:9090"
            {{- if .Values.logLevel }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- end }}
            - name: MEMORY_LIMIT
              value: {{ .Values.resources.memoryLimit | quote }}
            - name: MAX_THREADS
              value: {{ .Values.resources.maxThreads | quote }}
            - name: QUERY_TIMEOUT
              value: {{ .Values.resources.queryTimeout | quote }}
            - name: POOL_SIZE
              value: {{ .Values.resources.poolSize | quote }}
            {{- if .Values.resources.maxResultBytes }}
            - name: MAX_RESULT_BYTES
              value: {{ .Values.resources.maxResultBytes | quote }}
            {{- end }}
            {{- if .Values.resources.extensionDir }}
            - name: EXTENSION_DIR
              value: {{ .Values.resources.extensionDir | quote }}
            {{- end }}
            {{- if .Values.reconcileSql.existingSecret }}
            - name: RECONCILE_SQL_PATH
              value: {{ printf "/etc/duckflight/reconcile/%s" .Values.reconcileSql.key | quote }}
            {{- end }}
            {{- if .Values.rejectClientExtensions }}
            - name: REJECT_CLIENT_EXTENSIONS
              value: "true"
            {{- end }}
            {{- if .Values.tempDir.path }}
            - name: TEMP_DIRECTORY
              value: {{ .Values.tempDir.path | quote }}
            {{- end }}
            - name: ICEBERG_ENDPOINT
              value: {{ .Values.iceberg.endpoint | quote }}
            - name: ICEBERG_WAREHOUSE
              value: {{ .Values.iceberg.warehouse | quote }}
            {{- if .Values.iceberg.oauth2URI }}
            - name: ICEBERG_OAUTH2_URI
              value: {{ .Values.iceberg.oauth2URI | quote }}
            {{- end }}
            {{- if .Values.iceberg.existingSecret }}
            - name: ICEBERG_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.iceberg.existingSecret }}
                  key: client-id
            - name: ICEBERG_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.iceberg.existingSecret }}
                  key: client-secret
            {{- end }}
            {{- if .Values.s3.endpoint }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            {{- end }}
            {{- if .Values.s3.existingSecret }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: secret-key
            {{- end }}
            {{- if .Values.s3.region }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            {{- end }}
            {{- if .Values.s3.urlStyle }}
            - name: S3_URL_STYLE
              value: {{ .Values.s3.urlStyle | quote }}
            {{- end }}
            {{- if .Values.auth.existingSecret }}
            - name: AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: auth-tokens
                  optional: true
            - name: AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: auth-users
                  optional: true
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: jwt-secret
                  optional: true
            {{- end }}
            {{- if .Values.auth.jwtTTL }}
            - name: AUTH_JWT_TTL
              value: {{ .Values.auth.jwtTTL | quote }}
            {{- end }}
            {{- if .Values.oidc.issuer }}
            - name: OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            {{- end }}
            {{- if .Values.oidc.audience }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            {{- end }}
            {{- if .Values.rateLimit.rps }}
            - name: RATE_LIMIT_RPS
              value: {{ .Values.rateLimit.rps | quote }}
            {{- end }}
            {{- if .Values.rateLimit.burst }}
            - name: RATE_LIMIT_BURST
              value: {{ .Values.rateLimit.burst | quote }}
            {{- end }}
            {{- if .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            {{- if .Values.otel.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
            {{- if .Values.otel.insecure }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: TLS_CERT
              value: "/etc/tls/tls.crt"
            - name: TLS_KEY
              value: "/etc/tls/tls.key"
            {{- if .Values.tls.caSecret }}
            - name: TLS_CA
              value: "/etc/tls/ca/ca.crt"
            {{- end }}
            {{- end }}
          {{- if or .Values.tls.enabled .Values.extensions.image .Values.reconcileSql.existingSecret .Values.tempDir.path }}
          volumeMounts:
            {{- if .Values.tls.enabled }}
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            {{- if .Values.tls.caSecret }}
            - name: tls-ca
              mountPath: /etc/tls/ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.extensions.image }}
            # Shadows the extensions baked into the server image.
            - name: duckdb-extensions
              mountPath: {{ .Values.resources.extensionDir | default "/extensions" | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.reconcileSql.existingSecret }}
            - name: reconcile-sql
              mountPath: /etc/duckflight/reconcile
              readOnly: true
            {{- end }}
            {{- if .Values.tempDir.path }}
            - name: duckdb-temp
              mountPath: {{ .Values.tempDir.path | quote }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
          readinessProbe:
            grpc:
              port: 31337
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 31337
            initialDelaySeconds: 10
            periodSeconds: 30
      {{- if or .Values.tls.enabled .Values.extensions.image .Values.reconcileSql.existingSecret .Values.tempDir.path }}
      volumes:
        {{- if .Values.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- if .Values.tls.caSecret }}
        - name: tls-ca
          secret:
            secretName: {{ .Values.tls.caSecret }}
        {{- end }}
        {{- end }}
        {{- if .Values.extensions.image }}
        - name: duckdb-extensions
          emptyDir: {}
        {{- end }}
        {{- if .Values.reconcileSql.existingSecret }}
        # `optional` keeps the pod healthy before the Secret first exists;
        # the server treats a missing/empty file as "nothing to reconcile".
        - name: reconcile-sql
          secret:
            secretName: {{ .Values.reconcileSql.existingSecret }}
            optional: true
        {{- end }}
        {{- if .Values.tempDir.path }}
        - name: duckdb-temp
          emptyDir:
            {{- if .Values.tempDir.sizeLimit }}
            sizeLimit: {{ .Values.tempDir.sizeLimit }}
            {{- else }}
            {}
            {{- end }}
        {{- end }}
      {{- end }}
